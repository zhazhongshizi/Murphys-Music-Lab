[package]
name = "qqmusic-gui"
version = "2.0.1"
description = "Murphy’s Music Lab — a local-first music player"
authors = ["QQ Music GUI contributors"]
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false
default-run = "qqmusic-gui"

[lib]
name = "qqmusic_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "qqmusic-gui"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "qqmusic-fake-provider"
path = "tests/support/fake_provider.rs"
required-features = ["test-provider"]
test = false
bench = false

[[bin]]
name = "native-player-smoke"
path = "src/bin/native_player_smoke.rs"
required-features = ["manual-spikes"]
test = false
bench = false

[[bin]]
name = "provider-v2-fake"
path = "tests/support/fake_provider_v2.rs"
required-features = ["test-provider"]
test = false
bench = false

[[bin]]
name = "provider-supervisor-smoke"
path = "src/bin/provider_supervisor_smoke.rs"
required-features = ["manual-spikes"]
test = false
bench = false

[[bin]]
name = "provider-media-probe"
path = "src/bin/provider_media_probe.rs"
required-features = ["manual-spikes"]
test = false
bench = false

[[bin]]
name = "bilibili-production-probe"
path = "src/bin/bilibili_production_probe.rs"
required-features = ["manual-spikes"]
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["net", "sync", "time"] }
rusqlite = { version = "=0.40.1", features = ["bundled", "backup"] }
semver = "=1.0.28"
reqwest = { version = "=0.12.28", features = ["blocking", "stream"] }
futures-util = "=0.3.32"
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }
lofty = "=0.25.1"
rfd = "=0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["unbounded_depth"] }
regex = "=1.13.0"
sha2 = "=0.10.9"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-wdio = { version = "=1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }
url = "=2.5.8"
uuid = { version = "=1.23.4", features = ["v4"] }
zeroize = "=1.8.2"
rustfft = "=6.4.1"

[target.'cfg(windows)'.dependencies]
tauri-plugin-global-shortcut = "=2.3.1"
tauri-plugin-single-instance = "=2.4.3"
windows-core = "=0.61.2"
windows = { version = "=0.61.3", features = [
  "Foundation",
  "Media",
  "Media_Core",
  "Media_Playback",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "System_Profile",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.61.3", features = ["Media_Control"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
test-provider = []
manual-spikes = ["reqwest/stream"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
